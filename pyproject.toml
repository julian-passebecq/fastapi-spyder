[build-system]
requires = ["setuptools>=70", "wheel"]
build-backend = "setuptools.build_meta"

[project]
name = "fastapi-spyder"
version = "0.1.0.dev0"
description = "FastAPI architecture, lineage and debugging tools for Spyder"
readme = "README.md"
requires-python = ">=3.11"
license = {text = "MIT"}
authors = [
  {name = "Julian Passebecq"},
]
dependencies = [
  "fastapi>=0.115",
  "pydantic>=2.7",
]

[project.optional-dependencies]
spyder = [
  "spyder>=6",
  "qtpy",
]
dev = [
  "pytest>=8",
  "httpx>=0.27",
]

[project.scripts]
fastapi-spyder = "spyder_fastapi.cli:main"

[project.entry-points."spyder.plugins"]
spyder_fastapi = "spyder_fastapi.spyder.plugin:FastAPIStudioPlugin"

[tool.setuptools.packages.find]
where = ["src"]

[tool.pytest.ini_options]
testpaths = ["tests"]
addopts = "-q"
