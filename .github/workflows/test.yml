name: tests

on:
  push:
  pull_request:

jobs:
  core:
    runs-on: ubuntu-latest
    strategy:
      fail-fast: false
      matrix:
        python-version: ["3.11", "3.12", "3.13"]

    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-python@v5
        with:
          python-version: ${{ matrix.python-version }}

      - name: Install
        run: python -m pip install -e ".[dev]"

      - name: Compile
        run: python -m compileall -q src tests

      - name: Test
        run: python -m pytest

  spyder-plugin-import:
    runs-on: ubuntu-latest

    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"

      - name: Install with Spyder
        run: python -m pip install -e ".[dev,spyder]"

      - name: Import plugin API
        env:
          QT_QPA_PLATFORM: offscreen
        run: |
          python - <<'PY'
          from spyder_fastapi.spyder.plugin import FastAPIStudioPlugin
          from spyder_fastapi.spyder.widget import FastAPIStudioWidget
          print(FastAPIStudioPlugin.NAME, FastAPIStudioWidget.__name__)
          PY
